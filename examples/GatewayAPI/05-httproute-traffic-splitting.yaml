# Gateway API - HTTPRoute with Traffic Splitting (Canary)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-route
spec:
  parentRefs:
  - name: mygateway
  hostnames:
  - app.example.com
  rules:
  - backendRefs:
    - name: app-service-stable
      port: 8080
      weight: 90
    - name: app-service-canary
      port: 8080
      weight: 10
