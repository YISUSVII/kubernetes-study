# Gateway API - HTTPRoute with Redirects
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-route
spec:
  parentRefs:
  - name: mygateway
  hostnames:
  - old-domain.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: new-domain.com
        statusCode: 301
