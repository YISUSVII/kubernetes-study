# Gateway API - GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-api-route
spec:
  parentRefs:
  - name: mygateway
  hostnames:
  - grpc.example.com
  rules:
  - matches:
    - method:
        service: com.example.Service
        method: GetData
    backendRefs:
    - name: grpc-backend
      port: 50051
