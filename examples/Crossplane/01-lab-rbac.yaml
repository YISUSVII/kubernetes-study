# Crossplane's default chart uses the crossplane ServiceAccount.
# Allow the lab controller to compose ConfigMaps only in this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-study
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compose-configmaps
  namespace: crossplane-study
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-compose-configmaps
  namespace: crossplane-study
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compose-configmaps
