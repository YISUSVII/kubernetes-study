# Gateway API - HTTPRoute with Header Matching
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
spec:
  parentRefs:
  - name: mygateway
  hostnames:
  - api.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1
      headers:
      - name: X-Version
        value: beta
    backendRefs:
    - name: api-service
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 25s
